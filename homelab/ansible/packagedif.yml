---
- name: Sync installed packages across k3s worker nodes
  hosts: k3s_workers
  become: true
  gather_facts: true
  
  vars:
    base_host: worker01
    backup_dir: /root/package_backups
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    package_file: "{{ backup_dir }}/{{ base_host }}_packages_{{ timestamp }}.txt"
  
  tasks:
    # ========== SETUP ==========
    - name: Create backup directory on base host
      delegate_to: "{{ base_host }}"
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
    
    # ========== EXPORT VON BASE HOST ==========
    - name: Export installed packages from base host
      delegate_to: "{{ base_host }}"
      shell: |
        dpkg --get-selections | grep -v deinstall > {{ package_file }}
      register: pkg_export
    
    - name: Read base package list
      delegate_to: "{{ base_host }}"
      slurp:
        src: "{{ package_file }}"
      register: base_pkg_b64
    
    - name: Decode and store package list
      set_fact:
        base_packages: "{{ base_pkg_b64.content | b64decode | split('\n') | map('trim') | reject('equalto', '') | list }}"
    
    - name: Show package count
      debug:
        msg: "Base host hat {{ base_packages | length }} Pakete"
      run_once: true
    
# ========== SECOND PLAY: INSTALL ON WORKERS ==========
- name: Install missing packages on worker nodes
  hosts: k3s_workers
  become: true
  serial: 1
  gather_facts: false
  
  vars:
    base_host: worker01
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
  
  tasks:
    # Skip the base host itself
    - name: Skip base host
      meta: end_host
      when: inventory_hostname == base_host
    
    - name: Get currently installed packages
      shell: |
        if dpkg-query -W -f='${Status}' "{{ item }}" 2>/dev/null | grep -q "installed"; then
          echo "{{ item }}"
        fi
      loop: "{{ hostvars[base_host]['base_packages'] | default([]) }}"
      register: pkg_check
      changed_when: false
      failed_when: false
      ignore_errors: yes
    
    - name: Calculate missing packages
      set_fact:
        installed: "{{ pkg_check.results | 
                        selectattr('rc', 'equalto', 0) | 
                        map(attribute='stdout') | 
                        list }}"
        missing: "{{ hostvars[base_host]['base_packages'] | default([]) | difference(installed) }}"
    
    - name: Report missing packages
      debug:
        msg: >
          {{ inventory_hostname }}: {{ missing | length }} Pakete fehlen
          {% if missing | length <= 5 %}
          {{ missing | join(', ') }}
          {% endif %}
    
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
    
    - name: Install missing packages
      apt:
        name: "{{ missing }}"
        state: present
      when: missing | length > 0
    
    - name: Log sync completion
      copy:
        content: |
          Sync completed at {{ ansible_date_time.iso8601 }}
          Installed {{ hostvars[base_host]['base_packages'] | default([]) | length }} packages
          Missing: {{ missing | length }}
        dest: "/var/log/package_sync_{{ inventory_hostname }}.log"
      when: hostvars[base_host]['base_packages'] is defined
