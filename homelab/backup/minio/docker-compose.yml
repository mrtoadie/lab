version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio-desktop
    restart: unless-stopped

    ports:
      - "9000:9000"       # S3 API Endpoint (Velero)
      - "9001:9001"       # MinIO Console (UI)

    volumes:
      - /run/media/toadie/vm/Kubernetes/velero-backups/data:/data
      - /run/media/toadie/vm/Kubernetes/velero-backups/config:/root/.minio

    environment:
      - MINIO_ROOT_USER=velero-backup
      - MINIO_ROOT_PASSWORD=<PW>
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
      - MINIO_SERVER_URL=http://192.168.178.101:9000
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - velero-networks

    labels:
      - "com.minio.service=backup-storage"

networks:
  velero-networks:
    driver: bridge
