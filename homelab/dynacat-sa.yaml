apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynacat
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynacat-reader
rules:
  # Nodes readen (für Node Status Widget)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Pods readen (für Pod Count Widget)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Namespaces readen
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

  # Services readen
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  # Deployments readen (apps API group)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dynacat-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dynacat-reader  # ← WICHTIG: Nicht "view"!
subjects:
- kind: ServiceAccount
  name: dynacat
  namespace: monitoring
