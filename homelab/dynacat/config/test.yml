- name: test
  columns:
    - size: small
      widgets: []
    - size: full
      widgets:
        - type: custom-api
          title: Uptime Kumas
          title-url: ${UPTIME_KUMA_URL}
          url: ${UPTIME_KUMA_URL}/api/status-page/${UPTIME_KUMA_STATUS_SLUG}
          subrequests:
            heartbeats:
              url: ${UPTIME_KUMA_URL}/api/status-page/heartbeat/${UPTIME_KUMA_STATUS_SLUG}
          cache: 10m
          template: |
            {{ $hb := .Subrequest "heartbeats" }}

            {{ if not (.JSON.Exists "publicGroupList") }}
            <p class="color-negative">Error reading response</p>
            {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
            <p>No monitors found</p>
            {{ else }}

            <ul class="dynamic-columns list-gap-8">
              {{ range .JSON.Array "publicGroupList" }}
              {{ range .Array "monitorList" }}
              {{ $id := .String "id" }}
              {{ $hbArray := $hb.JSON.Array (print "heartbeatList." $id) }}
              <div class="flex items-center gap-12">
                <a class="size-title-dynamic color-highlight text-truncate block grow" href="${UPTIME_KUMA_URL}/dashboard/{{ $id }}"
                  target="_blank" rel="noreferrer">
                  {{ .String "name" }} </a>

                {{ if gt (len $hbArray) 0 }}
                  {{ $latest := index $hbArray (sub (len $hbArray) 1) }}
                  {{ if eq ($latest.Int "status") 1 }}
                  <div>{{ $latest.Int "ping" }}ms</div>
                  <div class="monitor-site-status-icon-compact" title="OK">
                    <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                      <path fill-rule="evenodd"
                        d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                        clip-rule="evenodd"></path>
                    </svg>
                  </div>
                  {{ else }}
                  <div><span class="color-negative">DOWN</span></div>
                  <div class="monitor-site-status-icon-compact" title="{{ if $latest.Exists "msg" }}{{ $latest.String "msg" }}{{ else
                    }}Error{{ end }}">
                    <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                      <path fill-rule="evenodd"
                        d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                        clip-rule="evenodd"></path>
                    </svg>
                  </div>
                  {{ end }}
                {{ else }}
                  <div><span class="color-negative">No data</span></div>
                  <div class="monitor-site-status-icon-compact" title="No data available">
                    <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                      <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-2a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm-.75-8a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V8zm.75 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                  </div>
                {{ end }}
              </div>
              {{ end }}
              {{ end }}
            </ul>
            {{ end }}
        - type: group
          widgets:
            - type: custom-api
              body-type: string
              cache: 1s
              frameless: true
              skip-json-validation: true
              template: |-
                {{ $localTime := now }}
                        {{ $secondsPerDay := 86400 }}
                        {{ $elapsedSeconds := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                        {{ $dayProgress := div (mul $elapsedSeconds 100.0) $secondsPerDay }}

                        {{ $gradient := "" }}
                        {{ if lt $dayProgress 10.0 }}
                          {{ $gradient = "#70a1ff" }}
                        {{ else if lt $dayProgress 25.0 }}
                          {{ $gradient = "#ff6b6b, #70a1ff" }}
                        {{ else if lt $dayProgress 50.0 }}
                          {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df" }}
                        {{ else }}
                          {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df, #70a1ff" }}
                        {{ end }}

                        <div style="font-family: sans-serif; text-align: center;">
                          <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                            <div style="
                              height: 100%;
                              width: {{ $dayProgress }}%;
                              background: linear-gradient(90deg, {{ $gradient }});
                            "></div>
                          </div>
                          <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $dayProgress }}% of the day has passed</div>
                        </div>
              title: Day
            - type: custom-api
              body-type: string
              cache: 1s
              frameless: true
              skip-json-validation: true
              template: |-
                {{ $localTime := now }}

                        {{ $month := $localTime.Month }}
                        {{ $dayOfMonth := $localTime.Day }}

                        {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                        {{ $fractionOfDay := div $secondsToday 86400.0 }}

                        {{ $daysInMonth := 31 }}
                        {{ if eq $month 2 }} {{ $daysInMonth = 28 }} {{ end }}
                        {{ if or (eq $month 4) (eq $month 6) (eq $month 9) (eq $month 11) }} {{ $daysInMonth = 30 }} {{ end }}

                        {{ $daysElapsed := add (sub $dayOfMonth 1) $fractionOfDay }}
                        {{ $monthProgress := mul (div $daysElapsed $daysInMonth) 100.0 }}

                        {{ $gradient := "" }}
                        {{ if lt $monthProgress 10.0 }}
                          {{ $gradient = "#70a1ff" }}
                        {{ else if lt $monthProgress 25.0 }}
                          {{ $gradient = "#ff6b6b, #70a1ff" }}
                        {{ else if lt $monthProgress 50.0 }}
                          {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df" }}
                        {{ else }}
                          {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df, #70a1ff" }}
                        {{ end }}

                        <div style="font-family: sans-serif; text-align: center;">
                          <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                            <div style="
                              height: 100%;
                              width: {{ $monthProgress }}%;
                              background: linear-gradient(90deg, {{ $gradient }});
                            "></div>
                          </div>
                          <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $monthProgress }}% of the month has passed</div>
                        </div>
              title: Month
        - type: custom-api
          body-type: string
          cache: 1s
          skip-json-validation: true
          template: "{{ $localTime := now }}\n        \n        {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}\n        {{ $dayOfYear := $localTime.YearDay }}\n        {{ $secondsElapsed := add (mul (sub $dayOfYear 1) 86400) $secondsToday }}\n\n        {{ $totalSecondsInYear := mul 365 86400 }}\n        {{ $yearProgress := div (mul $secondsElapsed 100.0) $totalSecondsInYear }}\n\n        {{ $gradient := \"\" }}\n        {{ if lt $yearProgress 10.0 }}\n          {{ $gradient = \"#70a1ff\" }}\n        {{ else if lt $yearProgress 25.0 }}\n          {{ $gradient = \"#ff6b6b, #70a1ff\" }}\n        {{ else if lt $yearProgress 50.0 }}\n          {{ $gradient = \"#ff6b6b, #f8e71c, #7ed6df\" }}\n        {{ else }}\n          {{ $gradient = \"#ff6b6b, #f8e71c, #7ed6df, #70a1ff\" }}\n        {{ end }}\n\n        <div style=\"font-family: sans-serif; text-align: center;\">\n          <div style=\"width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;\">\n            <div style=\"\n              height: 100%;\n              width: {{ $yearProgress }}%;\n              background: linear-gradient(90deg, {{ $gradient }});\n            \"></div>\n          </div>\n          <div class=\"size-h1\" style=\"margin-top: 6px;\">{{ printf \"%.2f\" $yearProgress }}% of the year has passed</div>\n        </div>"
          title: Year
