services:
  dynacat:
    container_name: dynacat
    image: panonim/dynacat
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- /home/toadie/.ssh/agent:/root/.ssh/agent:ro
    #ports:
    #  - 8080:8080
    env_file: .env
    environment:
      #- SSH_AUTH_SOCK=/root/.ssh/agent/s.DNctWd9x9u.agent.YweanNMOPf
      - TZ=Europe/Berlin
