---
# pi_shutdown.yml — clean shutdown of all Pi's
# Usage: ansible-playbook -i inventory.ini pi_shutdown.yml -K

- name: Controlled shutdown
  hosts: pi_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Shut down the Pis
      community.general.shutdown:
      # shutdown runs asynchron to avoid SSH false feedback
