server:
  assets-path: /app/assets
branding:
  logo-url: /assets/logo.png        # Zeigt dein Bild anstelle des "G"
  favicon-url: /assets/favico.png     # Browser-Tab Icon
  hide-logo: false                  # Standard: false, kann true sein wenn du nur Text willst
  app-name: "Homelab"
theme:
  background-color: 227 11 16
  contrast-multiplier: 1.2
  primary-color: 220 34 51
  positive-color: 136 53 43
  negative-color: 5 81 56
pages:
  # It's not necessary to create a new file for each page and include it, you can simply
  # put its contents here, though multiple pages are easier to manage when separated
  - $include: dashboard.yml
  - $include: kubernetes.yml
