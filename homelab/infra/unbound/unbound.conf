# /etc/unbound/unbound.conf
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    do-daemonize: yes
    username: "unbound"
    directory: "/etc/unbound"
    use-syslog: yes
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # Allow LAN clients (default is localhost only!)
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.178.0/24 allow

    # Static local records
    local-zone: "grafana.local." static
    local-data: "grafana.local. IN A 192.168.178.210"
    local-zone: "forgejo.local." static
    local-data: "forgejo.local. IN A 192.168.178.210"
    local-zone: "watcher.local." static
    local-data: "watcher.local. IN A 192.168.178.199"

# Encrypted upstream (DNS-over-TLS)
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
