# audiobookshelf/deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: metadata-volume
              mountPath: /metadata
            - name: library-volume
              mountPath: /audiobooks
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: audiobookshelf-config-local
        - name: metadata-volume
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata-local
        - name: library-volume
          persistentVolumeClaim:
            claimName: audiobookshelf-library-nfs
