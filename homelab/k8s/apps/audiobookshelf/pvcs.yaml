# audiobookshelf/pvcs.yaml
---
# Local-Path PVC for /config (SQLite Database)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config-local
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
# Local-Path PVC for /metadata (Cover & Item-Data)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata-local
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
# NFS PVC for Audio Library
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-library-nfs
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-dynamic
  resources:
    requests:
      storage: 50Gi
