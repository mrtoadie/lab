# forgejo.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-dynamic
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data

---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: dev
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
    - name: ssh
      port: 2222
      targetPort: 22
      nodePort: 30022
