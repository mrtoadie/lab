apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-dev-new
  labels:
    app: ubuntu-dev-new
    env: local
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ubuntu-dev-new
  template:
    metadata:
      labels:
        app: ubuntu-dev-new
        env: local
    spec:
      containers:
      - name: ubuntu
        image: ubuntu:24.04
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        stdin: true
        tty: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
