apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-dev
  labels:
    app: ubuntu-dev
    env: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu-dev
  template:
    metadata:
      labels:
        app: ubuntu-dev
        env: local
    spec:
      containers:
      - name: ubuntu
        image: ubuntu:24.04
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        stdin: true
        tty: true
